# ---------------------------------------------------------------------------
# Development profile: local PostgreSQL, verbose logging, friendly SQL.
# ---------------------------------------------------------------------------
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/merqo}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    show-sql: false
  flyway:
    clean-disabled: true

logging:
  level:
    com.merqo: DEBUG

merqo:
  demo-mode: ${DEMO_MODE:true}
  integration:
    secret-key: ${INTEGRATION_SECRET_KEY:merqo-dev-test-integration-secret-key-32bytes!}
