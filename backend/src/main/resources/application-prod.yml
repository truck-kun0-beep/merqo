# ---------------------------------------------------------------------------
# Production profile. Used on Render.
# Everything sensitive comes from an environment variable; nothing is hardcoded.
# ---------------------------------------------------------------------------
spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jpa:
    properties:
      hibernate:
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

logging:
  level:
    root: INFO
    com.merqo: ${MERQO_LOG_LEVEL:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health,info

merqo:
  # The deployed site is only reached over HTTPS, so the session cookie
  # carries the Secure flag. It can still be turned off for a demo host that
  # is not served over HTTPS.
  secure-cookie: ${SESSION_SECURE_COOKIE:true}
