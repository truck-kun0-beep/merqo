# ---------------------------------------------------------------------------
# Test profile. Runs against the real merqo_test PostgreSQL database.
# H2 and other in-memory substitutes are forbidden by the project brief.
# ---------------------------------------------------------------------------
spring:
  datasource:
    url: ${TEST_DATABASE_URL:jdbc:postgresql://localhost:5432/merqo_test}
    username: ${TEST_DB_USER:postgres}
    password: ${TEST_DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false
    clean-on-validation-error: false
  task:
    execution:
      shutdown:
        await-termination: true

logging:
  level:
    root: WARN
    com.merqo: INFO
    org.springframework: WARN
    org.flywaydb: INFO

merqo:
  demo-mode: true
  integration:
    secret-key: ${INTEGRATION_SECRET_KEY:merqo-dev-test-integration-secret-key-32bytes!}
